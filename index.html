<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Desert - Find Them Before It Finds You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }

        #gameCanvas {
            display: block;
        }

        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
        }

        #cameraViewfinder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 200px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            display: none;
        }

        #cameraViewfinder::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        #cameraViewfinder::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        #cameraViewfinder .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        #cameraViewfinder .corner.tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        #cameraViewfinder .corner.tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        #cameraViewfinder .corner.bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        #cameraViewfinder .corner.br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        #bodiesCount {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #stamina {
            position: absolute;
            bottom: 60px;
            left: 30px;
            width: 150px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
        }

        #staminaBar {
            height: 100%;
            background: rgba(255, 255, 255, 0.6);
            width: 100%;
            transition: width 0.1s;
        }

        #flashEffect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
        }

        #damageEffect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(139, 0, 0, 0.6) 100%);
            opacity: 0;
            pointer-events: none;
        }

        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.8) 100%);
            pointer-events: none;
        }

        #warning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #8b0000;
            font-size: 24px;
            opacity: 0;
            text-shadow: 0 0 20px #8b0000;
            letter-spacing: 8px;
        }

        #photoIndicator {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        #compass {
            position: absolute;
            top: 30px;
            right: 30px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }

        #exitMarker {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(100, 200, 100, 0.6);
            font-size: 14px;
            display: none;
        }

        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }

        #startScreen h1 {
            color: #fff;
            font-size: 48px;
            margin-bottom: 20px;
            letter-spacing: 15px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        #startScreen p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin: 10px 0;
            letter-spacing: 3px;
        }

        #startScreen .controls {
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            text-align: center;
            line-height: 2;
        }

        #startScreen .click-start {
            margin-top: 60px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.2; }
        }

        #gameOverScreen, #winScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #gameOverScreen h1 {
            color: #8b0000;
            font-size: 64px;
            letter-spacing: 20px;
            margin-bottom: 30px;
        }

        #winScreen h1 {
            color: #4a7c4e;
            font-size: 48px;
            letter-spacing: 15px;
            margin-bottom: 30px;
        }

        #gameOverScreen p, #winScreen p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            cursor: pointer;
        }

        #staticNoise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            pointer-events: none;
            background-image: url('data:image/svg+xml,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)"/></svg>');
        }

        #heartbeat {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(139, 0, 0, 0.15) 100%);
            opacity: 0;
            pointer-events: none;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            opacity: 0.3;
        }

        /* JUMPSCARE STYLES */
        #jumpscareContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            display: none;
            background: #000;
            overflow: hidden;
        }

        #jumpscareFace {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vmax;
            height: 100vmax;
        }

        #jumpscareGlitch {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            animation: glitchBg 0.1s infinite;
        }

        @keyframes glitchBg {
            0% { background: rgba(255, 0, 0, 0.1); transform: translate(0); }
            25% { background: rgba(0, 255, 255, 0.1); transform: translate(-5px, 5px); }
            50% { background: rgba(255, 0, 255, 0.1); transform: translate(5px, -5px); }
            75% { background: rgba(255, 255, 0, 0.1); transform: translate(-5px, -5px); }
            100% { background: rgba(255, 0, 0, 0.1); transform: translate(5px, 5px); }
        }

        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            10% { transform: translate(-48%, -52%) rotate(-3deg) scale(1.05); }
            20% { transform: translate(-52%, -48%) rotate(3deg) scale(0.95); }
            30% { transform: translate(-48%, -48%) rotate(-2deg) scale(1.1); }
            40% { transform: translate(-52%, -52%) rotate(2deg) scale(0.9); }
            50% { transform: translate(-50%, -50%) rotate(-4deg) scale(1.15); }
            60% { transform: translate(-48%, -52%) rotate(4deg) scale(0.85); }
            70% { transform: translate(-52%, -48%) rotate(-3deg) scale(1.1); }
            80% { transform: translate(-48%, -48%) rotate(3deg) scale(0.95); }
            90% { transform: translate(-52%, -52%) rotate(-2deg) scale(1.05); }
        }

        .jumpscare-active #jumpscareFace {
            animation: shake 0.1s infinite;
        }

        #jumpscareStatic {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.3;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        #chromatic {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
        }

        .chromatic-active {
            animation: chromaticPulse 0.05s infinite;
        }

        @keyframes chromaticPulse {
            0% { opacity: 0.8; filter: hue-rotate(0deg); }
            33% { opacity: 0.6; filter: hue-rotate(120deg); }
            66% { opacity: 0.9; filter: hue-rotate(240deg); }
            100% { opacity: 0.7; filter: hue-rotate(360deg); }
        }

        #bloodOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(80,0,0,0.3) 0%, rgba(30,0,0,0.8) 100%);
            pointer-events: none;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>THE DESERT</h1>
        <p>Find them before it finds you</p>
        <div class="controls">
            WASD - Move<br>
            SHIFT - Run<br>
            MOUSE - Look<br>
            RIGHT CLICK - Raise Camera<br>
            LEFT CLICK - Take Photo<br>
            F - Toggle Flashlight
        </div>
        <p class="click-start">Click to begin</p>
    </div>

    <div id="gameOverScreen">
        <h1>DEAD</h1>
        <p>Click to try again</p>
    </div>

    <div id="winScreen">
        <h1>YOU ESCAPED</h1>
        <p>Click to play again</p>
    </div>

    <!-- JUMPSCARE -->
    <div id="jumpscareContainer">
        <canvas id="jumpscareFace"></canvas>
        <div id="jumpscareGlitch"></div>
        <canvas id="jumpscareStatic"></canvas>
        <div id="chromatic"></div>
        <div id="bloodOverlay"></div>
    </div>

    <div id="ui">
        <div id="crosshair"></div>
        <div id="cameraViewfinder">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
        </div>
        <div id="bodiesCount">BODIES: 0/4</div>
        <div id="stamina"><div id="staminaBar"></div></div>
        <div id="photoIndicator">[RMB] Camera</div>
        <div id="compass">N</div>
        <div id="exitMarker">EXIT NEARBY</div>
        <div id="flashEffect"></div>
        <div id="damageEffect"></div>
        <div id="heartbeat"></div>
        <div id="vignette"></div>
        <div id="warning">IT SEES YOU</div>
        <div id="staticNoise"></div>
        <div class="scanlines"></div>
        <div id="bloodOverlay"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game State
        const GAME_STATE = {
            MENU: 0,
            PLAYING: 1,
            JUMPSCARE: 2,
            DEAD: 3,
            WON: 4
        };

        let gameState = GAME_STATE.MENU;
        let bodiesFound = 0;
        let health = 100;
        let stamina = 100;
        let isRunning = false;
        let isCameraUp = false;
        let flashlightOn = true;
        let canTakePhoto = true;
        let photoTimer = 0;

        // Three.js Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0808);
        scene.fog = new THREE.FogExp2(0x1a1008, 0.018);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.25;
        document.body.insertBefore(renderer.domElement, document.body.firstChild);
        renderer.domElement.id = 'gameCanvas';

        // Audio Context
        let audioContext;
        let ambienceGain;
        let isAudioInitialized = false;

        function initAudio() {
            if (isAudioInitialized) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            ambienceGain = audioContext.createGain();
            ambienceGain.gain.value = 0.15;
            ambienceGain.connect(audioContext.destination);
            isAudioInitialized = true;
            playAmbience();
        }

        function playAmbience() {
            if (!audioContext) return;

            // Desert wind noise
            const windBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 4, audioContext.sampleRate);
            const windData = windBuffer.getChannelData(0);
            for (let i = 0; i < windData.length; i++) {
                windData[i] = (Math.random() * 2 - 1) * 0.4;
            }

            const windSource = audioContext.createBufferSource();
            windSource.buffer = windBuffer;
            windSource.loop = true;

            const windFilter = audioContext.createBiquadFilter();
            windFilter.type = 'lowpass';
            windFilter.frequency.value = 300;

            const windFilter2 = audioContext.createBiquadFilter();
            windFilter2.type = 'highpass';
            windFilter2.frequency.value = 80;

            windSource.connect(windFilter);
            windFilter.connect(windFilter2);
            windFilter2.connect(ambienceGain);
            windSource.start();
        }

        function playHeartbeat(intensity) {
            if (!audioContext) return;

            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();

            osc.frequency.value = 40 + intensity * 20;
            osc.type = 'sine';

            gain.gain.setValueAtTime(0, audioContext.currentTime);
            gain.gain.linearRampToValueAtTime(0.3 * intensity, audioContext.currentTime + 0.05);
            gain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.25);

            osc.connect(gain);
            gain.connect(audioContext.destination);

            osc.start();
            osc.stop(audioContext.currentTime + 0.35);
        }

        function playCameraSound() {
            if (!audioContext) return;

            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();

            osc.frequency.value = 800;
            osc.type = 'square';

            gain.gain.setValueAtTime(0.1, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);

            osc.connect(gain);
            gain.connect(audioContext.destination);

            osc.start();
            osc.stop(audioContext.currentTime + 0.1);
        }

        function playCreatureSound(type) {
            if (!audioContext) return;

            if (type === 'growl') {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                const filter = audioContext.createBiquadFilter();

                osc.frequency.value = 50;
                osc.type = 'sawtooth';
                filter.type = 'lowpass';
                filter.frequency.value = 120;
                gain.gain.setValueAtTime(0.4, audioContext.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 1.5);
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                osc.stop(audioContext.currentTime + 2);
            } else if (type === 'scream') {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                const filter = audioContext.createBiquadFilter();

                osc.frequency.value = 200;
                osc.type = 'sawtooth';
                filter.type = 'bandpass';
                filter.frequency.value = 400;
                filter.Q.value = 5;
                gain.gain.setValueAtTime(0.5, audioContext.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.8);
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                osc.stop(audioContext.currentTime + 2);
            }
        }

        // JUMPSCARE AUDIO - TERRIFYING
        function playJumpscareSound() {
            if (!audioContext) return;

            // Layer 1: Deep demonic roar
            const roar = audioContext.createOscillator();
            const roarGain = audioContext.createGain();
            const roarFilter = audioContext.createBiquadFilter();
            roar.type = 'sawtooth';
            roar.frequency.setValueAtTime(60, audioContext.currentTime);
            roar.frequency.linearRampToValueAtTime(30, audioContext.currentTime + 1);
            roarFilter.type = 'lowpass';
            roarFilter.frequency.value = 200;
            roarGain.gain.setValueAtTime(1, audioContext.currentTime);
            roarGain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 1.5);
            roar.connect(roarFilter);
            roarFilter.connect(roarGain);
            roarGain.connect(audioContext.destination);
            roar.start();
            roar.stop(audioContext.currentTime + 1.5);

            // Layer 2: High pitched shriek
            const shriek = audioContext.createOscillator();
            const shriekGain = audioContext.createGain();
            shriek.type = 'square';
            shriek.frequency.setValueAtTime(800, audioContext.currentTime);
            shriek.frequency.exponentialRampToValueAtTime(2000, audioContext.currentTime + 0.1);
            shriek.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.5);
            shriekGain.gain.setValueAtTime(0.8, audioContext.currentTime);
            shriekGain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.8);
            shriek.connect(shriekGain);
            shriekGain.connect(audioContext.destination);
            shriek.start();
            shriek.stop(audioContext.currentTime + 0.8);

            // Layer 3: Distorted noise burst
            const noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 1.5, audioContext.sampleRate);
            const noiseData = noiseBuffer.getChannelData(0);
            for (let i = 0; i < noiseData.length; i++) {
                noiseData[i] = (Math.random() * 2 - 1) * (1 - i / noiseData.length);
            }
            const noise = audioContext.createBufferSource();
            noise.buffer = noiseBuffer;
            const noiseGain = audioContext.createGain();
            const noiseFilter = audioContext.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.value = 1000;
            noiseFilter.Q.value = 1;
            noiseGain.gain.setValueAtTime(0.7, audioContext.currentTime);
            noiseGain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 1.2);
            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioContext.destination);
            noise.start();

            // Layer 4: Sub bass hit
            const sub = audioContext.createOscillator();
            const subGain = audioContext.createGain();
            sub.type = 'sine';
            sub.frequency.value = 25;
            subGain.gain.setValueAtTime(1, audioContext.currentTime);
            subGain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1);
            sub.connect(subGain);
            subGain.connect(audioContext.destination);
            sub.start();
            sub.stop(audioContext.currentTime + 1);

            // Layer 5: Metallic screech
            const screech = audioContext.createOscillator();
            const screechGain = audioContext.createGain();
            const screechFilter = audioContext.createBiquadFilter();
            screech.type = 'sawtooth';
            screech.frequency.setValueAtTime(3000, audioContext.currentTime);
            screech.frequency.linearRampToValueAtTime(1500, audioContext.currentTime + 0.3);
            screechFilter.type = 'highpass';
            screechFilter.frequency.value = 1000;
            screechGain.gain.setValueAtTime(0.4, audioContext.currentTime);
            screechGain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.5);
            screech.connect(screechFilter);
            screechFilter.connect(screechGain);
            screechGain.connect(audioContext.destination);
            screech.start();
            screech.stop(audioContext.currentTime + 0.5);

            // Layer 6: Breath/whisper
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const whisper = audioContext.createOscillator();
                    const whisperGain = audioContext.createGain();
                    const whisperFilter = audioContext.createBiquadFilter();
                    whisper.type = 'sawtooth';
                    whisper.frequency.value = 100 + Math.random() * 50;
                    whisperFilter.type = 'bandpass';
                    whisperFilter.frequency.value = 500;
                    whisperFilter.Q.value = 10;
                    whisperGain.gain.setValueAtTime(0.3, audioContext.currentTime);
                    whisperGain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.3);
                    whisper.connect(whisperFilter);
                    whisperFilter.connect(whisperGain);
                    whisperGain.connect(audioContext.destination);
                    whisper.start();
                    whisper.stop(audioContext.currentTime + 0.3);
                }, i * 200);
            }
        }

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x221111, 0.2);
        scene.add(ambientLight);

        // Blood moon
        const moonLight = new THREE.DirectionalLight(0x883333, 0.15);
        moonLight.position.set(50, 100, 50);
        scene.add(moonLight);

        // Flashlight
        const flashlight = new THREE.SpotLight(0xffeecc, 2.5, 35, Math.PI / 6, 0.5, 1.5);
        flashlight.castShadow = true;
        flashlight.shadow.mapSize.width = 1024;
        flashlight.shadow.mapSize.height = 1024;
        camera.add(flashlight);
        flashlight.position.set(0, 0, 0);
        flashlight.target.position.set(0, 0, -1);
        camera.add(flashlight.target);
        scene.add(camera);

        // Desert Ground
        const groundGeometry = new THREE.PlaneGeometry(250, 250, 150, 150);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x8B7355,
            roughness: 1,
            metalness: 0
        });

        // Sand dunes - more pronounced height variation
        const vertices = groundGeometry.attributes.position.array;
        for (let i = 0; i < vertices.length; i += 3) {
            const x = vertices[i];
            const y = vertices[i + 1];
            // Create dune-like patterns
            vertices[i + 2] =
                Math.sin(x * 0.05) * Math.cos(y * 0.03) * 2 +
                Math.sin(x * 0.1 + y * 0.1) * 1 +
                (Math.random() - 0.5) * 0.3;
        }
        groundGeometry.computeVertexNormals();

        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Desert obstacles (cacti, dead trees, rocks, skulls)
        const obstacles = [];
        const obstaclePositions = [];

        function createCactus(x, z) {
            const group = new THREE.Group();
            const cactusMaterial = new THREE.MeshStandardMaterial({
                color: 0x2d4a2d,
                roughness: 0.8
            });

            // Main trunk
            const height = 2 + Math.random() * 3;
            const trunkGeometry = new THREE.CylinderGeometry(0.2, 0.3, height, 8);
            const trunk = new THREE.Mesh(trunkGeometry, cactusMaterial);
            trunk.position.y = height / 2;
            trunk.castShadow = true;
            group.add(trunk);

            // Arms
            if (Math.random() > 0.3) {
                const armHeight = 1 + Math.random();
                const armGeometry = new THREE.CylinderGeometry(0.12, 0.15, armHeight, 6);

                const arm1 = new THREE.Mesh(armGeometry, cactusMaterial);
                arm1.position.set(0.4, height * 0.6, 0);
                arm1.rotation.z = -Math.PI / 4;
                arm1.castShadow = true;
                group.add(arm1);

                if (Math.random() > 0.5) {
                    const arm2 = new THREE.Mesh(armGeometry, cactusMaterial);
                    arm2.position.set(-0.4, height * 0.5, 0);
                    arm2.rotation.z = Math.PI / 4;
                    arm2.castShadow = true;
                    group.add(arm2);
                }
            }

            group.position.set(x, 0, z);
            return group;
        }

        function createDeadTree(x, z) {
            const group = new THREE.Group();
            const woodMaterial = new THREE.MeshStandardMaterial({
                color: 0x3d2817,
                roughness: 0.9
            });

            const height = 3 + Math.random() * 4;
            const trunkGeometry = new THREE.CylinderGeometry(0.1, 0.3, height, 6);
            const trunk = new THREE.Mesh(trunkGeometry, woodMaterial);
            trunk.position.y = height / 2;
            trunk.rotation.z = (Math.random() - 0.5) * 0.3;
            trunk.castShadow = true;
            group.add(trunk);

            // Dead branches
            for (let i = 0; i < 3 + Math.random() * 3; i++) {
                const branchLength = 0.5 + Math.random() * 1.5;
                const branchGeometry = new THREE.CylinderGeometry(0.02, 0.06, branchLength, 4);
                const branch = new THREE.Mesh(branchGeometry, woodMaterial);
                branch.position.y = height * 0.4 + Math.random() * height * 0.5;
                branch.position.x = (Math.random() - 0.5) * 0.3;
                branch.rotation.z = (Math.random() - 0.5) * 2;
                branch.rotation.x = (Math.random() - 0.5) * 1;
                branch.castShadow = true;
                group.add(branch);
            }

            group.position.set(x, 0, z);
            return group;
        }

        function createRock(x, z) {
            const group = new THREE.Group();
            const rockMaterial = new THREE.MeshStandardMaterial({
                color: 0x4a4035,
                roughness: 0.95
            });

            const size = 0.5 + Math.random() * 1.5;
            const rockGeometry = new THREE.DodecahedronGeometry(size, 0);
            const rock = new THREE.Mesh(rockGeometry, rockMaterial);
            rock.position.y = size * 0.4;
            rock.rotation.set(Math.random(), Math.random(), Math.random());
            rock.scale.y = 0.6;
            rock.castShadow = true;
            group.add(rock);

            // Smaller rocks around
            for (let i = 0; i < Math.random() * 3; i++) {
                const smallSize = 0.2 + Math.random() * 0.4;
                const smallRock = new THREE.Mesh(
                    new THREE.DodecahedronGeometry(smallSize, 0),
                    rockMaterial
                );
                smallRock.position.set(
                    (Math.random() - 0.5) * 2,
                    smallSize * 0.3,
                    (Math.random() - 0.5) * 2
                );
                smallRock.rotation.set(Math.random(), Math.random(), Math.random());
                group.add(smallRock);
            }

            group.position.set(x, 0, z);
            return group;
        }

        function createSkull(x, z) {
            const group = new THREE.Group();
            const boneMaterial = new THREE.MeshStandardMaterial({
                color: 0xd4c9a8,
                roughness: 0.7
            });

            // Skull
            const skullGeometry = new THREE.SphereGeometry(0.15, 8, 6);
            const skull = new THREE.Mesh(skullGeometry, boneMaterial);
            skull.scale.set(1, 0.9, 1.1);
            skull.position.y = 0.1;
            skull.rotation.x = -0.3;
            group.add(skull);

            // Eye sockets (dark)
            const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const eyeGeometry = new THREE.SphereGeometry(0.03, 6, 6);
            const eye1 = new THREE.Mesh(eyeGeometry, eyeMaterial);
            eye1.position.set(0.04, 0.12, 0.12);
            group.add(eye1);
            const eye2 = new THREE.Mesh(eyeGeometry, eyeMaterial);
            eye2.position.set(-0.04, 0.12, 0.12);
            group.add(eye2);

            group.position.set(x, 0, z);
            group.rotation.y = Math.random() * Math.PI * 2;
            return group;
        }

        // Generate desert environment
        const DESERT_RADIUS = 90;
        const OBSTACLE_COUNT = 300;

        for (let i = 0; i < OBSTACLE_COUNT; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 8 + Math.random() * (DESERT_RADIUS - 8);
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;

            let tooClose = false;
            for (const pos of obstaclePositions) {
                const dist = Math.sqrt((x - pos.x) ** 2 + (z - pos.z) ** 2);
                if (dist < 3) {
                    tooClose = true;
                    break;
                }
            }

            if (!tooClose) {
                const type = Math.random();
                let obstacle;
                let collisionRadius = 0.5;

                if (type < 0.25) {
                    obstacle = createCactus(x, z);
                    collisionRadius = 0.4;
                } else if (type < 0.5) {
                    obstacle = createDeadTree(x, z);
                    collisionRadius = 0.4;
                } else if (type < 0.85) {
                    obstacle = createRock(x, z);
                    collisionRadius = 1;
                } else {
                    obstacle = createSkull(x, z);
                    collisionRadius = 0.2;
                }

                obstacles.push(obstacle);
                obstaclePositions.push({ x, z, radius: collisionRadius });
                scene.add(obstacle);
            }
        }

        // Bodies
        const bodies = [];
        const bodyPositions = [
            { x: 35, z: 35 },
            { x: -45, z: 25 },
            { x: 30, z: -50 },
            { x: -40, z: -40 }
        ];

        function createBody(x, z) {
            const group = new THREE.Group();

            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0x4a4a5a,
                roughness: 0.8
            });

            // Torso
            const torsoGeometry = new THREE.BoxGeometry(0.5, 0.3, 0.8);
            const torso = new THREE.Mesh(torsoGeometry, bodyMaterial);
            torso.position.y = 0.15;
            group.add(torso);

            // Head
            const headGeometry = new THREE.SphereGeometry(0.15, 8, 6);
            const head = new THREE.Mesh(headGeometry, bodyMaterial);
            head.position.set(0, 0.15, 0.5);
            group.add(head);

            // Limbs
            const limbGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.5, 6);

            const arm1 = new THREE.Mesh(limbGeometry, bodyMaterial);
            arm1.position.set(0.35, 0.15, 0.2);
            arm1.rotation.z = Math.PI / 2 + 0.3;
            group.add(arm1);

            const arm2 = new THREE.Mesh(limbGeometry, bodyMaterial);
            arm2.position.set(-0.35, 0.15, 0);
            arm2.rotation.z = -Math.PI / 2 - 0.2;
            group.add(arm2);

            const leg1 = new THREE.Mesh(limbGeometry, bodyMaterial);
            leg1.position.set(0.15, 0.1, -0.4);
            leg1.rotation.x = Math.PI / 2 + 0.1;
            group.add(leg1);

            const leg2 = new THREE.Mesh(limbGeometry, bodyMaterial);
            leg2.position.set(-0.15, 0.1, -0.5);
            leg2.rotation.x = Math.PI / 2 - 0.2;
            group.add(leg2);

            group.position.set(x, 0, z);
            group.rotation.y = Math.random() * Math.PI * 2;
            group.userData.found = false;

            return group;
        }

        bodyPositions.forEach(pos => {
            const body = createBody(pos.x, pos.z);
            bodies.push(body);
            scene.add(body);
        });

        // Exit zone
        const exitPosition = { x: 0, z: -DESERT_RADIUS - 5 };
        const exitGeometry = new THREE.BoxGeometry(10, 0.1, 10);
        const exitMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a4a2a,
            transparent: true,
            opacity: 0.3
        });
        const exitZone = new THREE.Mesh(exitGeometry, exitMaterial);
        exitZone.position.set(exitPosition.x, 0.05, exitPosition.z);
        scene.add(exitZone);

        // THE CREATURE - More terrifying
        let creature;
        let creatureState = 'search';
        let creatureTarget = new THREE.Vector3();
        let creatureFleeTimer = 0;
        let lastSeenPlayer = new THREE.Vector3();
        let creatureAlertness = 0;

        function createCreature() {
            const group = new THREE.Group();

            const creatureMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a1a,
                roughness: 0.6,
                metalness: 0.3
            });

            const fleshMaterial = new THREE.MeshStandardMaterial({
                color: 0x3a1515,
                roughness: 0.5
            });

            // Tall thin body - taller and more disturbing
            const bodyGeometry = new THREE.CylinderGeometry(0.25, 0.4, 5, 8);
            const body = new THREE.Mesh(bodyGeometry, creatureMaterial);
            body.position.y = 3.5;
            group.add(body);

            // Hunched upper body - twisted
            const upperGeometry = new THREE.SphereGeometry(0.7, 8, 6);
            const upper = new THREE.Mesh(upperGeometry, creatureMaterial);
            upper.position.y = 6.3;
            upper.scale.set(1, 1.4, 0.7);
            group.add(upper);

            // Head - elongated, wrong proportions
            const headGeometry = new THREE.SphereGeometry(0.5, 8, 6);
            const head = new THREE.Mesh(headGeometry, fleshMaterial);
            head.position.set(0, 7.2, 0.4);
            head.scale.set(0.7, 1.4, 1);
            group.add(head);

            // Distorted face features
            const mouthGeometry = new THREE.BoxGeometry(0.3, 0.5, 0.2);
            const mouth = new THREE.Mesh(mouthGeometry, new THREE.MeshBasicMaterial({ color: 0x000000 }));
            mouth.position.set(0, 6.9, 0.8);
            group.add(mouth);

            // Eyes - glowing, wrong placement
            const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0xff2222 });
            const eyeGeometry = new THREE.SphereGeometry(0.1, 6, 6);

            const eye1 = new THREE.Mesh(eyeGeometry, eyeMaterial);
            eye1.position.set(0.18, 7.3, 0.75);
            group.add(eye1);

            const eye2 = new THREE.Mesh(eyeGeometry, eyeMaterial);
            eye2.position.set(-0.18, 7.4, 0.75);
            group.add(eye2);

            // Third eye
            const eye3 = new THREE.Mesh(eyeGeometry, eyeMaterial);
            eye3.position.set(0, 7.6, 0.7);
            eye3.scale.set(0.7, 0.7, 0.7);
            group.add(eye3);

            // Unnaturally long arms
            const armGeometry = new THREE.CylinderGeometry(0.06, 0.1, 4, 6);

            const arm1 = new THREE.Mesh(armGeometry, creatureMaterial);
            arm1.position.set(0.8, 4.5, 0);
            arm1.rotation.z = -0.2;
            arm1.rotation.x = 0.3;
            group.add(arm1);

            const arm2 = new THREE.Mesh(armGeometry, creatureMaterial);
            arm2.position.set(-0.8, 4.5, 0);
            arm2.rotation.z = 0.2;
            arm2.rotation.x = 0.3;
            group.add(arm2);

            // Long fingers/claws
            for (let i = 0; i < 2; i++) {
                const side = i === 0 ? 1 : -1;
                for (let j = 0; j < 4; j++) {
                    const fingerGeometry = new THREE.ConeGeometry(0.03, 0.4, 4);
                    const finger = new THREE.Mesh(fingerGeometry, creatureMaterial);
                    finger.position.set(
                        side * 1.1 + (j - 1.5) * 0.08 * side,
                        2.3,
                        0.5
                    );
                    finger.rotation.x = Math.PI * 0.8;
                    group.add(finger);
                }
            }

            // Thin legs with backward knees
            const upperLegGeometry = new THREE.CylinderGeometry(0.1, 0.12, 1.5, 6);
            const lowerLegGeometry = new THREE.CylinderGeometry(0.08, 0.1, 1.5, 6);

            const leg1Upper = new THREE.Mesh(upperLegGeometry, creatureMaterial);
            leg1Upper.position.set(0.25, 1.2, -0.2);
            leg1Upper.rotation.x = 0.3;
            group.add(leg1Upper);

            const leg1Lower = new THREE.Mesh(lowerLegGeometry, creatureMaterial);
            leg1Lower.position.set(0.25, 0.3, 0.3);
            leg1Lower.rotation.x = -0.5;
            group.add(leg1Lower);

            const leg2Upper = new THREE.Mesh(upperLegGeometry, creatureMaterial);
            leg2Upper.position.set(-0.25, 1.2, -0.2);
            leg2Upper.rotation.x = 0.3;
            group.add(leg2Upper);

            const leg2Lower = new THREE.Mesh(lowerLegGeometry, creatureMaterial);
            leg2Lower.position.set(-0.25, 0.3, 0.3);
            leg2Lower.rotation.x = -0.5;
            group.add(leg2Lower);

            // Spawn far from player
            const spawnAngle = Math.random() * Math.PI * 2;
            const spawnRadius = 50 + Math.random() * 20;
            group.position.set(
                Math.cos(spawnAngle) * spawnRadius,
                0,
                Math.sin(spawnAngle) * spawnRadius
            );

            group.userData.animTime = 0;

            return group;
        }

        creature = createCreature();
        scene.add(creature);

        // Dust particles
        const dustParticles = [];
        const dustGeometry = new THREE.SphereGeometry(0.3, 4, 4);
        const dustMaterial = new THREE.MeshBasicMaterial({
            color: 0x8B7355,
            transparent: true,
            opacity: 0.08
        });

        for (let i = 0; i < 80; i++) {
            const dust = new THREE.Mesh(dustGeometry, dustMaterial.clone());
            dust.position.set(
                (Math.random() - 0.5) * 180,
                Math.random() * 4,
                (Math.random() - 0.5) * 180
            );
            dust.userData.speed = 0.3 + Math.random() * 0.5;
            dust.userData.offset = Math.random() * Math.PI * 2;
            dustParticles.push(dust);
            scene.add(dust);
        }

        // ============ JUMPSCARE SYSTEM ============
        function drawCreatureFace(canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scale = Math.min(canvas.width, canvas.height) / 400;

            // Dark background
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Face outline - distorted oval
            ctx.save();
            ctx.translate(centerX, centerY);

            // Main face - dark grayish skin
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 200 * scale);
            gradient.addColorStop(0, '#2a1a1a');
            gradient.addColorStop(0.7, '#1a0a0a');
            gradient.addColorStop(1, '#000');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.ellipse(0, 0, 180 * scale, 250 * scale, 0, 0, Math.PI * 2);
            ctx.fill();

            // Sunken cheeks
            ctx.fillStyle = '#0a0505';
            ctx.beginPath();
            ctx.ellipse(-80 * scale, 30 * scale, 40 * scale, 60 * scale, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(80 * scale, 30 * scale, 40 * scale, 60 * scale, -0.3, 0, Math.PI * 2);
            ctx.fill();

            // Eyes - large, glowing, wrong
            const eyeGlow = ctx.createRadialGradient(-60 * scale, -40 * scale, 0, -60 * scale, -40 * scale, 50 * scale);
            eyeGlow.addColorStop(0, '#ff0000');
            eyeGlow.addColorStop(0.3, '#aa0000');
            eyeGlow.addColorStop(0.7, '#550000');
            eyeGlow.addColorStop(1, 'transparent');

            ctx.fillStyle = eyeGlow;
            ctx.beginPath();
            ctx.ellipse(-60 * scale, -40 * scale, 50 * scale, 50 * scale, 0, 0, Math.PI * 2);
            ctx.fill();

            const eyeGlow2 = ctx.createRadialGradient(60 * scale, -50 * scale, 0, 60 * scale, -50 * scale, 50 * scale);
            eyeGlow2.addColorStop(0, '#ff0000');
            eyeGlow2.addColorStop(0.3, '#aa0000');
            eyeGlow2.addColorStop(0.7, '#550000');
            eyeGlow2.addColorStop(1, 'transparent');

            ctx.fillStyle = eyeGlow2;
            ctx.beginPath();
            ctx.ellipse(60 * scale, -50 * scale, 45 * scale, 50 * scale, 0, 0, Math.PI * 2);
            ctx.fill();

            // Eye sockets - black voids
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(-60 * scale, -40 * scale, 30 * scale, 35 * scale, 0.1, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(60 * scale, -50 * scale, 28 * scale, 33 * scale, -0.1, 0, Math.PI * 2);
            ctx.fill();

            // Pupils - small, piercing
            ctx.fillStyle = '#ff0000';
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 20 * scale;
            ctx.beginPath();
            ctx.arc(-60 * scale, -40 * scale, 8 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(60 * scale, -50 * scale, 8 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Third eye
            const thirdEyeGlow = ctx.createRadialGradient(0, -100 * scale, 0, 0, -100 * scale, 35 * scale);
            thirdEyeGlow.addColorStop(0, '#ff0000');
            thirdEyeGlow.addColorStop(0.5, '#660000');
            thirdEyeGlow.addColorStop(1, 'transparent');
            ctx.fillStyle = thirdEyeGlow;
            ctx.beginPath();
            ctx.arc(0, -100 * scale, 35 * scale, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(0, -100 * scale, 18 * scale, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff0000';
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 15 * scale;
            ctx.beginPath();
            ctx.arc(0, -100 * scale, 5 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Mouth - wide, gaping, wrong
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(0, 80 * scale, 100 * scale, 70 * scale, 0, 0, Math.PI * 2);
            ctx.fill();

            // Teeth - jagged, broken
            ctx.fillStyle = '#d4c9a8';
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI + Math.PI;
                const x = Math.cos(angle) * 85 * scale;
                const y = 80 * scale + Math.sin(angle) * 55 * scale;
                const height = 15 + Math.random() * 25;
                const width = 8 + Math.random() * 8;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle + Math.PI / 2 + (Math.random() - 0.5) * 0.3);
                ctx.beginPath();
                ctx.moveTo(-width * scale / 2, 0);
                ctx.lineTo(0, -height * scale);
                ctx.lineTo(width * scale / 2, 0);
                ctx.fill();
                ctx.restore();
            }

            // Bottom teeth
            for (let i = 0; i < 10; i++) {
                const angle = (i / 10) * Math.PI;
                const x = Math.cos(angle) * 80 * scale;
                const y = 80 * scale + Math.sin(angle) * 50 * scale;
                const height = 12 + Math.random() * 20;
                const width = 6 + Math.random() * 6;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle - Math.PI / 2 + (Math.random() - 0.5) * 0.4);
                ctx.beginPath();
                ctx.moveTo(-width * scale / 2, 0);
                ctx.lineTo(0, height * scale);
                ctx.lineTo(width * scale / 2, 0);
                ctx.fill();
                ctx.restore();
            }

            // Dripping blood/darkness from mouth
            ctx.fillStyle = '#1a0000';
            for (let i = 0; i < 8; i++) {
                const x = (i - 3.5) * 25 * scale;
                const dripLength = 30 + Math.random() * 60;
                ctx.beginPath();
                ctx.ellipse(x, 140 * scale + dripLength * scale / 2, 4 * scale, dripLength * scale / 2, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Veins/cracks on face
            ctx.strokeStyle = '#3a1515';
            ctx.lineWidth = 2 * scale;
            for (let i = 0; i < 15; i++) {
                const startX = (Math.random() - 0.5) * 300 * scale;
                const startY = (Math.random() - 0.5) * 400 * scale;
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                let x = startX, y = startY;
                for (let j = 0; j < 5; j++) {
                    x += (Math.random() - 0.5) * 40 * scale;
                    y += (Math.random() - 0.5) * 40 * scale;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawStatic(canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const v = Math.random() * 255;
                data[i] = v;
                data[i + 1] = v * 0.8;
                data[i + 2] = v * 0.8;
                data[i + 3] = Math.random() * 100;
            }

            ctx.putImageData(imageData, 0, 0);
        }

        let jumpscareInterval;
        let staticInterval;

        function triggerJumpscare() {
            gameState = GAME_STATE.JUMPSCARE;

            const container = document.getElementById('jumpscareContainer');
            const faceCanvas = document.getElementById('jumpscareFace');
            const staticCanvas = document.getElementById('jumpscareStatic');
            const chromatic = document.getElementById('chromatic');
            const bloodOverlay = document.getElementById('bloodOverlay');

            container.style.display = 'block';
            container.classList.add('jumpscare-active');
            chromatic.classList.add('chromatic-active');
            bloodOverlay.style.opacity = '1';

            // Draw the terrifying face
            drawCreatureFace(faceCanvas);

            // Static effect
            staticInterval = setInterval(() => {
                drawStatic(staticCanvas);
            }, 50);

            // Redraw face with slight variations for extra horror
            jumpscareInterval = setInterval(() => {
                faceCanvas.getContext('2d').save();
                faceCanvas.getContext('2d').translate(
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 20
                );
                drawCreatureFace(faceCanvas);
                faceCanvas.getContext('2d').restore();
            }, 100);

            // Play the horrifying sound
            playJumpscareSound();

            // End jumpscare after delay
            setTimeout(() => {
                clearInterval(jumpscareInterval);
                clearInterval(staticInterval);
                container.style.display = 'none';
                container.classList.remove('jumpscare-active');
                chromatic.classList.remove('chromatic-active');
                bloodOverlay.style.opacity = '0';

                gameState = GAME_STATE.DEAD;
                document.exitPointerLock();
                document.getElementById('gameOverScreen').style.display = 'flex';
            }, 2500);
        }

        // Player movement
        const keys = {};
        const playerVelocity = new THREE.Vector3();
        let playerYaw = 0;
        let playerPitch = 0;

        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 'f' && gameState === GAME_STATE.PLAYING) {
                flashlightOn = !flashlightOn;
                flashlight.intensity = flashlightOn ? 2.5 : 0;
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (gameState !== GAME_STATE.PLAYING) return;
            if (document.pointerLockElement !== renderer.domElement) return;

            playerYaw -= e.movementX * 0.002;
            playerPitch -= e.movementY * 0.002;
            playerPitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, playerPitch));
        });

        document.addEventListener('mousedown', (e) => {
            if (gameState !== GAME_STATE.PLAYING) return;

            if (e.button === 2) {
                isCameraUp = true;
                document.getElementById('cameraViewfinder').style.display = 'block';
                document.getElementById('crosshair').style.display = 'none';
            } else if (e.button === 0 && isCameraUp && canTakePhoto) {
                takePhoto();
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (e.button === 2) {
                isCameraUp = false;
                document.getElementById('cameraViewfinder').style.display = 'none';
                document.getElementById('crosshair').style.display = 'block';
            }
        });

        document.addEventListener('contextmenu', (e) => e.preventDefault());

        function takePhoto() {
            canTakePhoto = false;
            photoTimer = 1.5;

            playCameraSound();

            const flash = document.getElementById('flashEffect');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 100);

            // Check if creature is in view
            const creatureDir = new THREE.Vector3();
            creatureDir.subVectors(creature.position, camera.position);
            const distance = creatureDir.length();
            creatureDir.normalize();

            const cameraDir = new THREE.Vector3(0, 0, -1);
            cameraDir.applyQuaternion(camera.quaternion);

            const dot = cameraDir.dot(creatureDir);

            if (dot > 0.7 && distance < 25) {
                creatureState = 'flee';
                creatureFleeTimer = 10 + Math.random() * 5;

                const fleeDir = new THREE.Vector3();
                fleeDir.subVectors(creature.position, camera.position);
                fleeDir.y = 0;
                fleeDir.normalize();
                fleeDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), (Math.random() - 0.5) * Math.PI);

                creatureTarget.copy(creature.position).add(fleeDir.multiplyScalar(70));

                playCreatureSound('scream');
            }

            // Check for bodies
            bodies.forEach(body => {
                if (body.userData.found) return;

                const bodyDir = new THREE.Vector3();
                bodyDir.subVectors(body.position, camera.position);
                const bodyDist = bodyDir.length();
                bodyDir.normalize();

                const bodyDot = cameraDir.dot(bodyDir);

                if (bodyDot > 0.8 && bodyDist < 10) {
                    body.userData.found = true;
                    bodiesFound++;
                    document.getElementById('bodiesCount').textContent = `BODIES: ${bodiesFound}/4`;

                    body.children.forEach(child => {
                        if (child.material) {
                            child.material.emissive = new THREE.Color(0x222244);
                            child.material.emissiveIntensity = 0.3;
                        }
                    });
                }
            });
        }

        function updateCreature(delta) {
            if (gameState !== GAME_STATE.PLAYING) return;

            const playerPos = camera.position.clone();
            playerPos.y = 0;
            const creaturePos = creature.position.clone();
            creaturePos.y = 0;

            const distToPlayer = playerPos.distanceTo(creaturePos);

            // Animation
            creature.userData.animTime += delta;
            const animTime = creature.userData.animTime;
            creature.position.y = Math.sin(animTime * 3) * 0.15;
            creature.children.forEach((child, i) => {
                if (i > 6) {
                    child.rotation.x = Math.sin(animTime * 4 + i) * 0.3;
                }
            });

            switch (creatureState) {
                case 'search':
                    if (creatureTarget.length() === 0 || creaturePos.distanceTo(creatureTarget) < 3) {
                        const angle = Math.random() * Math.PI * 2;
                        const radius = 20 + Math.random() * 50;
                        creatureTarget.set(
                            Math.cos(angle) * radius,
                            0,
                            Math.sin(angle) * radius
                        );
                    }

                    const searchDir = new THREE.Vector3();
                    searchDir.subVectors(creatureTarget, creaturePos);
                    searchDir.y = 0;
                    searchDir.normalize();

                    creature.position.x += searchDir.x * 3.5 * delta;
                    creature.position.z += searchDir.z * 3.5 * delta;
                    creature.rotation.y = Math.atan2(searchDir.x, searchDir.z);

                    if (distToPlayer < 35) {
                        const isVisible = flashlightOn || distToPlayer < 10;
                        if (isVisible) {
                            creatureAlertness += delta * (35 - distToPlayer) * 0.08;
                            if (creatureAlertness > 1) {
                                creatureState = 'attack';
                                playCreatureSound('growl');
                            }
                        }
                    } else {
                        creatureAlertness = Math.max(0, creatureAlertness - delta * 0.5);
                    }
                    break;

                case 'attack':
                    const attackDir = new THREE.Vector3();
                    attackDir.subVectors(playerPos, creaturePos);
                    attackDir.y = 0;
                    attackDir.normalize();

                    const attackSpeed = 7 + (isRunning ? 0 : 2.5);
                    creature.position.x += attackDir.x * attackSpeed * delta;
                    creature.position.z += attackDir.z * attackSpeed * delta;
                    creature.rotation.y = Math.atan2(attackDir.x, attackDir.z);

                    lastSeenPlayer.copy(playerPos);

                    // DEATH - TRIGGER JUMPSCARE
                    if (distToPlayer < 1.5) {
                        triggerJumpscare();
                        return;
                    }

                    document.getElementById('damageEffect').style.opacity = Math.max(0, 0.3 * (1 - distToPlayer / 10));

                    if (distToPlayer > 55) {
                        creatureState = 'search';
                        creatureAlertness = 0;
                        creatureTarget.copy(lastSeenPlayer);
                    }
                    break;

                case 'flee':
                    creatureFleeTimer -= delta;

                    const fleeDir = new THREE.Vector3();
                    fleeDir.subVectors(creatureTarget, creaturePos);
                    fleeDir.y = 0;

                    if (fleeDir.length() > 1) {
                        fleeDir.normalize();
                        creature.position.x += fleeDir.x * 12 * delta;
                        creature.position.z += fleeDir.z * 12 * delta;
                        creature.rotation.y = Math.atan2(fleeDir.x, fleeDir.z);
                    }

                    if (creatureFleeTimer <= 0) {
                        creatureState = 'search';
                        creatureAlertness = 0;
                    }
                    break;
            }

            // Keep in bounds
            const creatureDist = Math.sqrt(creature.position.x ** 2 + creature.position.z ** 2);
            if (creatureDist > DESERT_RADIUS) {
                const angle = Math.atan2(creature.position.z, creature.position.x);
                creature.position.x = Math.cos(angle) * DESERT_RADIUS;
                creature.position.z = Math.sin(angle) * DESERT_RADIUS;
            }

            // UI
            const warning = document.getElementById('warning');
            const heartbeat = document.getElementById('heartbeat');

            if (creatureState === 'attack') {
                warning.style.opacity = 0.6 + Math.sin(Date.now() * 0.015) * 0.4;
                heartbeat.style.opacity = 0.4 + Math.sin(Date.now() * 0.01) * 0.3;

                if (Math.random() < 0.03) {
                    playHeartbeat(1);
                }
            } else if (distToPlayer < 25 && creatureState === 'search') {
                const intensity = 1 - distToPlayer / 25;
                heartbeat.style.opacity = intensity * 0.25;
                warning.style.opacity = 0;

                if (Math.random() < 0.015 * intensity) {
                    playHeartbeat(intensity);
                }
            } else {
                warning.style.opacity = 0;
                heartbeat.style.opacity = 0;
            }
        }

        function updatePlayer(delta) {
            if (gameState !== GAME_STATE.PLAYING) return;

            camera.rotation.order = 'YXZ';
            camera.rotation.y = playerYaw;
            camera.rotation.x = playerPitch;

            const moveSpeed = isRunning ? 5.5 : 3;
            const forward = new THREE.Vector3(0, 0, -1);
            const right = new THREE.Vector3(1, 0, 0);

            forward.applyQuaternion(camera.quaternion);
            right.applyQuaternion(camera.quaternion);
            forward.y = 0;
            right.y = 0;
            forward.normalize();
            right.normalize();

            playerVelocity.set(0, 0, 0);

            if (keys['w']) playerVelocity.add(forward);
            if (keys['s']) playerVelocity.sub(forward);
            if (keys['a']) playerVelocity.sub(right);
            if (keys['d']) playerVelocity.add(right);

            if (playerVelocity.length() > 0) {
                playerVelocity.normalize();

                isRunning = keys['shift'] && stamina > 0;

                if (isRunning) {
                    stamina = Math.max(0, stamina - 25 * delta);
                }

                playerVelocity.multiplyScalar(moveSpeed * delta);

                const newPos = camera.position.clone().add(playerVelocity);
                let canMove = true;

                for (const obs of obstaclePositions) {
                    const dist = Math.sqrt((newPos.x - obs.x) ** 2 + (newPos.z - obs.z) ** 2);
                    if (dist < obs.radius + 0.3) {
                        canMove = false;
                        break;
                    }
                }

                const playerDist = Math.sqrt(newPos.x ** 2 + newPos.z ** 2);
                if (playerDist > DESERT_RADIUS + 15) {
                    canMove = false;
                }

                if (canMove) {
                    camera.position.add(playerVelocity);
                }
            } else {
                isRunning = false;
            }

            if (!isRunning) {
                stamina = Math.min(100, stamina + 12 * delta);
            }

            document.getElementById('staminaBar').style.width = stamina + '%';

            if (playerVelocity.length() > 0) {
                camera.position.y = 1.7 + Math.sin(Date.now() * 0.01 * (isRunning ? 1.5 : 1)) * 0.05;
            }

            if (!canTakePhoto) {
                photoTimer -= delta;
                if (photoTimer <= 0) {
                    canTakePhoto = true;
                }
            }

            // Exit check
            const exitDist = Math.sqrt(
                (camera.position.x - exitPosition.x) ** 2 +
                (camera.position.z - exitPosition.z) ** 2
            );

            if (bodiesFound >= 4) {
                document.getElementById('exitMarker').style.display = 'block';

                if (exitDist < 7) {
                    gameState = GAME_STATE.WON;
                    document.exitPointerLock();
                    document.getElementById('winScreen').style.display = 'flex';
                }
            } else {
                document.getElementById('exitMarker').style.display = 'none';
            }

            // Compass
            const compassDir = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const angle = ((-playerYaw * 180 / Math.PI) % 360 + 360) % 360;
            const compassIndex = Math.round(angle / 45) % 8;
            document.getElementById('compass').textContent = compassDir[compassIndex];
        }

        // Animation loop
        let lastTime = 0;

        function animate(currentTime) {
            requestAnimationFrame(animate);

            const delta = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;

            if (gameState === GAME_STATE.PLAYING) {
                updatePlayer(delta);
                updateCreature(delta);

                // Dust particles
                dustParticles.forEach(dust => {
                    dust.position.x += Math.sin(currentTime * 0.0003 + dust.userData.offset) * dust.userData.speed * delta * 2;
                    dust.position.z += Math.cos(currentTime * 0.0002 + dust.userData.offset) * dust.userData.speed * delta;
                    dust.material.opacity = 0.04 + Math.sin(currentTime * 0.001 + dust.userData.offset) * 0.02;
                });

                // Camera shake when creature close
                const distToCreature = camera.position.distanceTo(creature.position);
                if (distToCreature < 15) {
                    const shakeIntensity = (15 - distToCreature) / 15 * 0.004;
                    camera.rotation.x += (Math.random() - 0.5) * shakeIntensity;
                    camera.rotation.y += (Math.random() - 0.5) * shakeIntensity;
                }
            }

            renderer.render(scene, camera);
        }

        // Start screen
        document.getElementById('startScreen').addEventListener('click', () => {
            if (gameState !== GAME_STATE.MENU) return;

            initAudio();
            gameState = GAME_STATE.PLAYING;
            document.getElementById('startScreen').style.display = 'none';
            renderer.domElement.requestPointerLock();
        });

        document.getElementById('gameOverScreen').addEventListener('click', () => {
            location.reload();
        });

        document.getElementById('winScreen').addEventListener('click', () => {
            location.reload();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate(0);
    </script>
</body>
</html>
